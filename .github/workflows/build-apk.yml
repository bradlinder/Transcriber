name: Build APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'App variant to build'
        type: choice
        default: 'all'
        options:
          - all
          - scrib
          - max
          - remote
      build_type:
        description: 'Android build type'
        type: choice
        default: 'release'
        options:
          - release
          - debug
      abis:
        description: 'Target ABIs (comma-separated, ignored for remote)'
        type: string
        default: 'arm64-v8a'
      run_tests:
        description: 'Run JVM unit tests before assembling APK'
        type: boolean
        default: true
      publish_release:
        description: 'Publish APK files to GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.resolve.outputs.variants }}
      build_type: ${{ steps.resolve.outputs.build_type }}
      abis: ${{ steps.resolve.outputs.abis }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build matrix
        id: resolve
        run: |
          VARIANT="${{ inputs.variant }}"
          BUILD_TYPE="${{ inputs.build_type }}"
          ABIS="${{ inputs.abis }}"
          [ -z "$VARIANT" ] && VARIANT="all"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="release"
          [ -z "$ABIS" ] && ABIS="arm64-v8a"

          if [ "$VARIANT" = "all" ]; then
            VARIANTS_JSON='["scrib","max"]'
          else
            VARIANTS_JSON="[\"${VARIANT}\"]"
          fi

          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          [ -z "$VERSION_NAME" ] && VERSION_NAME="dev"

          echo "variants=$VARIANTS_JSON" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

  build-apk:
    name: Build ${{ matrix.variant }} APK
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure transcribe.cpp submodule is populated
        run: |
          if [ ! -f transcribe.cpp/CMakeLists.txt ]; then
            git submodule update --init --recursive || true
          fi
          if [ ! -f transcribe.cpp/CMakeLists.txt ]; then
            rm -rf transcribe.cpp
            git clone --depth 1 https://github.com/handy-computer/transcribe.cpp.git transcribe.cpp
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK components (API 35 & NDK 27)
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx runtime (max variant only)
        if: ${{ matrix.variant == 'max' }}
        run: bash scripts/download-sherpa-onnx.sh

      - name: Prepare APK signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          KEYSTORE_B64="${SIGNING_KEYSTORE_B64:-$RELEASE_KEYSTORE_B64}"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.keystore
          elif [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storepass scrib_release_pass \
              -alias scrib_release \
              -keypass scrib_release_pass \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Scrib CI Build, OU=Transcriber, O=Scrib, C=US"
          fi

      - name: Resolve build flags
        id: cfg
        run: |
          VARIANT="${{ matrix.variant }}"
          BUILD_TYPE="${{ needs.plan.outputs.build_type }}"
          VARIANT_FLAG=""
          if [ "$VARIANT" = "max" ]; then
            VARIANT_FLAG="-PwithSherpa"
          elif [ "$VARIANT" = "remote" ]; then
            VARIANT_FLAG="-PwithRemote"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            ASSEMBLE_TASK=":app:assembleDebug"
          else
            ASSEMBLE_TASK=":app:assembleRelease"
          fi

          echo "variant_flag=$VARIANT_FLAG" >> "$GITHUB_OUTPUT"
          echo "assemble_task=$ASSEMBLE_TASK" >> "$GITHUB_OUTPUT"
          echo "test_task=:app:testDebugUnitTest" >> "$GITHUB_OUTPUT"
          echo "python_bin=$(which python3)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: ${{ inputs.run_tests == null || inputs.run_tests }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.cfg.outputs.test_task }} \
            ${{ steps.cfg.outputs.variant_flag }} \
            -Pabis="${{ needs.plan.outputs.abis }}" \
            -Pchaquopy.buildPython="${{ steps.cfg.outputs.python_bin }}" \
            --no-daemon

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.cfg.outputs.assemble_task }} \
            ${{ steps.cfg.outputs.variant_flag }} \
            -Pabis="${{ needs.plan.outputs.abis }}" \
            -Pchaquopy.buildPython="${{ steps.cfg.outputs.python_bin }}" \
            --no-daemon

      - name: Package APK artifacts
        run: |
          mkdir -p dist
          VERSION="${{ needs.plan.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          FOUND=0
          for apk in $(find app/build/outputs/apk -type f -name '*.apk'); do
            FOUND=1
            base="$(basename "$apk" .apk)"
            cp "$apk" "dist/Transcriber-v${VERSION}-${VARIANT}-${base}.apk"
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No APK files found under app/build/outputs/apk" >&2
            exit 1
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-v${{ needs.plan.outputs.version }}-${{ matrix.variant }}-${{ needs.plan.outputs.build_type }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [plan, build-apk]
    if: ${{ (inputs.publish_release == null || inputs.publish_release) && (needs.plan.outputs.build_type == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: Transcriber-*-apk
          path: apks
          merge-multiple: true

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.plan.outputs.version }}"
          TITLE="Transcriber ${TAG}"
          NOTES="Automated APK build for ${TAG} (variants: ${{ join(fromJSON(needs.plan.outputs.variants), ', ') }}, ABIs: ${{ needs.plan.outputs.abis }}, build: ${{ needs.plan.outputs.build_type }})."

          ls -lh apks/
          git push --force origin "$GITHUB_SHA:refs/tags/${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" apks/*.apk --clobber
          else
            gh release create "$TAG" apks/*.apk \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          git push --force origin "$GITHUB_SHA:refs/tags/latest"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES"
            gh release upload latest apks/*.apk --clobber
          else
            gh release create latest apks/*.apk \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
